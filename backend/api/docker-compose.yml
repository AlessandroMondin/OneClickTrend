services:
  postgres:
    image: postgres:17-alpine
    container_name: oneclicktrend-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oneclicktrend
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.0
    container_name: oneclicktrend-localstack
    environment:
      SERVICES: s3
      PERSISTENCE: 1
    # Bound to all interfaces on purpose: the phone PUTs to presigned URLs over LAN.
    ports:
      - "4566:4566"
    volumes:
      - ./localstack-data:/var/lib/localstack
      - ./scripts/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://oneclicktrend-media"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
